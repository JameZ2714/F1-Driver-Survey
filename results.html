<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
            <title>
                Results of your Survey!
            </title>

            <script>
                window.onload = function () {
                    const data = JSON.parse(localStorage.getItem('f1QuizData'));

                    if (!data) {
                        document.body.innerHTML = "<p>No quiz data found. Please take the quiz first.</p>";
                        return;
                    }

                    const name = data.name;
                    const team = data.team;
                    const number = parseInt(data.number);

                    let driver = "Unknown Driver";
                    let image = "";

                    if (team === "RedBull" && (number === 1 || number === 33)) {
                        driver = "Max Verstappen";
                        image = "/image/verstappen.jpeg";
                    } else if (team === "Ferrari" && number === 16) {
                        driver = "Charles Leclerc";
                        image = "/image/leclerc.jpeg";
                    } else if (team === "Ferrari" && number === 44) {
                        driver = "Lewis Hamilton";
                        image = "/image/hamilton.jpeg";
                    } else if (team === "Mercedes" && number === 12) {
                        driver = "Kimi Antonelli";
                        image = "/image/antonelli.jpeg";
                    } else if (team === "Mercedes" && number === 63) {
                        driver = "George Russell";
                        image = "/image/russell.webp";
                    } else if (team === "Mclaren" && number === 4) {
                        driver = "Lando Norris";
                        image = "/image/norris.webp";
                    } else if (team === "Mclaren" && number === 81) {
                        driver = "Oscar Piastri";
                        image = "/image/piastri.jpeg";
                    }

                    document.getElementById("userName").textContent = name;
                    document.getElementById("yourDriver").textContent = driver;
                    document.getElementById("driverImg").src = image;
                    };
            </script>
    </head>

    <body>
        <h1>Hello, <span id="userName"></span>!</h1>
        <h2>Your F1 driver is: <span id="yourDriver"></span></h2>
        <img id="driverImg" src="" alt="Driver Image" width="300px">

    </body>

    <footer>
        <button><a href="index.html">Return to Survey</a></button>
    </footer>
</html>
